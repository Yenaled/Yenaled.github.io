<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MRI Viewer</title>
  <style>html,body,#gl{height:100%;margin:0}</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <script type="module">
    import { Niivue } from "https://cdn.jsdelivr.net/npm/@niivue/niivue@0.62.0/dist/index.js";
    const nv = new Niivue({ dragAndDropEnabled: true, isColorbar: true });
    await nv.attachTo("gl");
    nv.loadVolumes([
      { url: "mri/DICOM_SEIZURE_20140421131023_3.nii.gz" }
    ]);
  </script>
</body>
</html>
